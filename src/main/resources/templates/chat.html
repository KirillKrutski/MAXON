<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="chat-container">
    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>💬 Чаты</h2>
            <div class="user-info">
                <span th:text="${username}">Пользователь</span>
                <div class="user-actions">
                    <button onclick="showChangePasswordModal()" class="btn-secondary" title="Сменить пароль">🔑</button>
                    <button onclick="logout()" class="btn-secondary">🚪 Выйти</button>
                </div>
            </div>
        </div>

        <!-- Поиск пользователей -->
        <div class="search-section">
            <input type="text" id="userSearch" placeholder="🔍 Поиск пользователей..."
                   oninput="searchUsers(this.value)">
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Входящие запросы -->
        <div class="requests-section">
            <h4>📨 Запросы в друзья</h4>
            <div id="friendRequests" class="requests-list"></div>
        </div>

        <!-- Список контактов -->
        <div class="contacts-section">
            <h3>👥 Мои контакты</h3>
            <div id="contactsList" class="contacts-list">
                <div class="no-contacts">Контактов пока нет</div>
            </div>
        </div>
    </div>

    <!-- Основная область чата -->
    <div class="chat-area">
        <div class="no-chat-selected">
            <h2>Добро пожаловать в чат!</h2>
            <p>Выберите контакт для начала общения</p>
            <p><em>Для начала найдите пользователей через поиск и добавьте их в контакты</em></p>
        </div>

        <!-- Область активного чата (пока скрыта) -->
        <div id="activeChat" class="chat-window hidden">
            <div class="chat-header">
                <h3 id="chatTitle">Имя пользователя</h3>
                <div id="chatParticipants" class="chat-participants"></div>
            </div>

            <div id="messagesContainer" class="messages-container">
                <!-- Сообщения будут здесь -->
            </div>

            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
                <button id="sendMessageBtn" disabled>📤 Отправить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно смены пароля -->
<div id="changePasswordModal" class="modal hidden">
    <div class="modal-content">
        <h3>🔑 Смена пароля</h3>

        <div class="form-group">
            <label for="currentPassword">Текущий пароль:</label>
            <input type="password" id="currentPassword" placeholder="Введите текущий пароль">
        </div>

        <div class="form-group">
            <label for="newPassword">Новый пароль:</label>
            <input type="password" id="newPassword" placeholder="Введите новый пароль" minlength="3">
        </div>

        <div class="form-group">
            <label for="confirmNewPassword">Подтвердите новый пароль:</label>
            <input type="password" id="confirmNewPassword" placeholder="Повторите новый пароль">
        </div>

        <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="hideChangePasswordModal()">Отмена</button>
            <button type="button" class="btn-primary" onclick="changePassword()">Сменить пароль</button>
        </div>

        <div id="changePasswordMessage" class="message"></div>
    </div>
</div>

<script>
    let currentUser = null;
    let currentChat = null;

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    document.addEventListener('DOMContentLoaded', function() {
        console.log("🚀 Инициализация чата...");
        loadUser();
    });

    // Загрузка информации о текущем пользователе
    async function loadUser() {
        try {
            const response = await fetch('/api/user/current');
            if (response.ok) {
                currentUser = await response.json();
                console.log("✅ Пользователь загружен:", currentUser.username);
                loadFriendRequests();
                loadContacts();
            } else {
                console.error("❌ Пользователь не авторизован");
                window.location.href = '/';
            }
        } catch (error) {
            console.error('❌ Ошибка загрузки пользователя:', error);
            window.location.href = '/';
        }
    }

    // ==================== СМЕНА ПАРОЛЯ ====================
    // Показать модальное окно смены пароля
    function showChangePasswordModal() {
        document.getElementById('changePasswordModal').classList.remove('hidden');
        // Очищаем поля и сообщения
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmNewPassword').value = '';
        document.getElementById('changePasswordMessage').textContent = '';
    }

    // Скрыть модальное окно смены пароля
    function hideChangePasswordModal() {
        document.getElementById('changePasswordModal').classList.add('hidden');
    }

    // Смена пароля
    async function changePassword() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;
        const messageElement = document.getElementById('changePasswordMessage');
        const changeBtn = document.querySelector('#changePasswordModal .btn-primary');

        // Валидация
        if (!currentPassword || !newPassword || !confirmNewPassword) {
            showChangePasswordMessage('Заполните все поля', 'error');
            return;
        }

        if (newPassword.length < 3) {
            showChangePasswordMessage('Новый пароль должен содержать минимум 3 символа', 'error');
            return;
        }

        if (newPassword !== confirmNewPassword) {
            showChangePasswordMessage('Новые пароли не совпадают', 'error');
            return;
        }

        // Показываем загрузку
        changeBtn.textContent = 'Смена...';
        changeBtn.disabled = true;

        try {
            console.log("🔄 Смена пароля...");

            const response = await fetch('/api/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `currentPassword=${encodeURIComponent(currentPassword)}&newPassword=${encodeURIComponent(newPassword)}`
            });

            const data = await response.json();
            console.log("📨 Ответ смены пароля:", data);

            if (data.success) {
                showChangePasswordMessage('Пароль успешно изменен!', 'success');
                // Закрываем окно через 2 секунды
                setTimeout(() => {
                    hideChangePasswordModal();
                }, 2000);
            } else {
                showChangePasswordMessage(data.message || 'Ошибка смены пароля', 'error');
            }
        } catch (error) {
            console.error('💥 Ошибка смены пароля:', error);
            showChangePasswordMessage('Ошибка соединения с сервером', 'error');
        } finally {
            // Восстанавливаем кнопку
            changeBtn.textContent = 'Сменить пароль';
            changeBtn.disabled = false;
        }
    }

    // Показать сообщение в модальном окне
    function showChangePasswordMessage(message, type) {
        const element = document.getElementById('changePasswordMessage');
        element.textContent = message;
        element.className = `message ${type}`;
    }

    // ==================== ПОИСК ПОЛЬЗОВАТЕЛЕЙ ====================
    async function searchUsers(query) {
        const resultsContainer = document.getElementById('searchResults');

        if (!query || query.trim().length < 2) {
            resultsContainer.innerHTML = '';
            return;
        }

        console.log("🔍 Поиск пользователей:", query);

        try {
            const response = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`);
            if (!response.ok) {
                throw new Error('Ошибка поиска');
            }

            const users = await response.json();
            console.log("📋 Найдено пользователей:", users.length);
            displaySearchResults(users);
        } catch (error) {
            console.error('❌ Ошибка поиска:', error);
            resultsContainer.innerHTML = '<div class="no-results">❌ Ошибка поиска</div>';
        }
    }

    // Отображение результатов поиска
    function displaySearchResults(users) {
        const container = document.getElementById('searchResults');

        if (users.length === 0) {
            container.innerHTML = '<div class="no-results">👤 Пользователи не найдены</div>';
            return;
        }

        container.innerHTML = users.map(user => `
                <div class="search-result-item">
                    <div class="user-info">
                        <strong>👤 ${user.username}</strong>
                        <span class="user-id">ID: ${user.id}</span>
                    </div>
                    <button class="btn-small send-request-btn"
                            onclick="sendFriendRequest(${user.id})"
                            title="Отправить запрос в друзья">
                        📨 Добавить
                    </button>
                </div>
            `).join('');
    }

    // ==================== ЗАПРОСЫ В ДРУЗЬЯ ====================
    // Отправка запроса в друзья
    async function sendFriendRequest(toUserId) {
        if (!currentUser) {
            alert('❌ Вы не авторизованы');
            return;
        }

        console.log("🔄 Отправка запроса пользователю ID:", toUserId);

        try {
            const response = await fetch('/api/friend-request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `toUserId=${toUserId}`
            });

            const data = await response.json();
            console.log("📨 Ответ сервера:", data);

            if (data.success) {
                alert('✅ Запрос отправлен!');
                // Очищаем результаты поиска
                document.getElementById('searchResults').innerHTML = '';
                document.getElementById('userSearch').value = '';
            } else {
                alert('❌ ' + data.message);
            }
        } catch (error) {
            console.error('💥 Ошибка отправки запроса:', error);
            alert('💥 Ошибка соединения с сервером');
        }
    }

    // Загрузка входящих запросов
    async function loadFriendRequests() {
        try {
            const response = await fetch('/api/friend-requests/incoming');
            if (!response.ok) {
                throw new Error('Ошибка загрузки запросов');
            }

            const requests = await response.json();
            console.log("📨 Загружено запросов:", requests.length);
            displayFriendRequests(requests);
        } catch (error) {
            console.error('❌ Ошибка загрузки запросов:', error);
        }
    }

    // Отображение входящих запросов
    function displayFriendRequests(requests) {
        const container = document.getElementById('friendRequests');

        if (requests.length === 0) {
            container.innerHTML = '<div class="no-requests">📭 Запросов нет</div>';
            return;
        }

        container.innerHTML = requests.map(request => `
                <div class="friend-request-item">
                    <div class="request-info">
                        <strong>👤 ${request.fromUsername}</strong>
                        <span>хочет добавить вас в контакты</span>
                    </div>
                    <div class="request-actions">
                        <button class="btn-small accept-btn"
                                onclick="acceptFriendRequest(${request.id})"
                                title="Принять запрос">
                            ✅ Принять
                        </button>
                        <button class="btn-small reject-btn"
                                onclick="rejectFriendRequest(${request.id})"
                                title="Отклонить запрос">
                            ❌ Отклонить
                        </button>
                    </div>
                </div>
            `).join('');
    }

    // Принятие запроса
    async function acceptFriendRequest(requestId) {
        console.log("✅ Принятие запроса ID:", requestId);

        try {
            const response = await fetch(`/api/friend-requests/${requestId}/accept`, {
                method: 'POST'
            });

            const data = await response.json();

            if (data.success) {
                alert('✅ Запрос принят! Пользователь добавлен в контакты');
                // Обновляем интерфейс
                loadFriendRequests();
                loadContacts();
            } else {
                alert('❌ Ошибка принятия запроса: ' + data.message);
            }
        } catch (error) {
            console.error('💥 Ошибка принятия запроса:', error);
            alert('💥 Ошибка соединения с сервером');
        }
    }

    // Отклонение запроса
    async function rejectFriendRequest(requestId) {
        console.log("❌ Отклонение запроса ID:", requestId);

        if (!confirm('Вы уверены, что хотите отклонить запрос?')) {
            return;
        }

        try {
            const response = await fetch(`/api/friend-requests/${requestId}/reject`, {
                method: 'POST'
            });

            const data = await response.json();

            if (data.success) {
                alert('✅ Запрос отклонен');
                loadFriendRequests();
            } else {
                alert('❌ Ошибка отклонения запроса');
            }
        } catch (error) {
            console.error('💥 Ошибка отклонения запроса:', error);
            alert('💥 Ошибка соединения с сервером');
        }
    }

    // ==================== КОНТАКТЫ ====================
    // Загрузка контактов
    async function loadContacts() {
        try {
            const response = await fetch('/api/contacts');
            if (!response.ok) {
                throw new Error('Ошибка загрузки контактов');
            }

            const contacts = await response.json();
            console.log("📞 Загружено контактов:", contacts.length);
            displayContacts(contacts);
        } catch (error) {
            console.error('❌ Ошибка загрузки контактов:', error);
        }
    }

    // Отображение контактов
    function displayContacts(contacts) {
        const container = document.getElementById('contactsList');

        if (contacts.length === 0) {
            container.innerHTML = '<div class="no-contacts">👥 Контактов пока нет</div>';
            return;
        }

        container.innerHTML = contacts.map(contact => `
                <div class="contact-item" data-user-id="${contact.id}">
                    <div class="contact-avatar">👤</div>
                    <div class="contact-info">
                        <div class="contact-name">${contact.username}</div>
                        <div class="contact-status">🟢 В сети</div>
                    </div>
                    <button class="btn-small start-chat-btn"
                            onclick="startChat(${contact.id}, '${contact.username}')"
                            title="Начать чат">
                        💬 Чат
                    </button>
                </div>
            `).join('');
    }

    // Начало чата
    function startChat(userId, username) {
        console.log("💬 Начало чата с:", username, "ID:", userId);

        // Показываем область чата
        document.querySelector('.no-chat-selected').classList.add('hidden');
        document.getElementById('activeChat').classList.remove('hidden');

        // Устанавливаем информацию о чате
        document.getElementById('chatTitle').textContent = username;
        document.getElementById('chatParticipants').textContent = `Участники: ${username}`;

        // Активируем поле ввода
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendMessageBtn').disabled = false;

        // Фокусируемся на поле ввода
        document.getElementById('messageInput').focus();

        // Сохраняем информацию о текущем чате
        currentChat = {
            id: userId,
            name: username,
            isPrivate: true
        };

        // TODO: Загрузить историю сообщений
        loadChatMessages(userId);
    }

    // Загрузка сообщений чата (заглушка)
    async function loadChatMessages(chatId) {
        console.log("📨 Загрузка сообщений для чата ID:", chatId);
        // TODO: Реализовать загрузку сообщений
        document.getElementById('messagesContainer').innerHTML = `
                <div class="no-messages">
                    <p>💬 Начните общение с этим пользователем!</p>
                    <p><em>Отправьте первое сообщение</em></p>
                </div>
            `;
    }

    // Отправка сообщения
    async function sendMessage() {
        if (!currentChat || !currentUser) {
            alert('❌ Чат не выбран');
            return;
        }

        const messageInput = document.getElementById('messageInput');
        const content = messageInput.value.trim();

        if (!content) {
            return;
        }

        console.log("📤 Отправка сообщения:", content);

        // TODO: Реализовать отправку сообщения
        alert('📤 Функция отправки сообщений будет реализована в следующем обновлении!');

        // Очищаем поле ввода
        messageInput.value = '';
    }

    // Обработчик нажатия Enter в поле ввода
    document.getElementById('messageInput')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Обработчик кнопки отправки
    document.getElementById('sendMessageBtn')?.addEventListener('click', sendMessage);

    // ==================== СИСТЕМНЫЕ ФУНКЦИИ ====================
    // Выход из системы
    async function logout() {
        console.log("🚪 Выход из системы...");

        if (!confirm('Вы уверены, что хотите выйти?')) {
            return;
        }

        try {
            const response = await fetch('/api/logout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            });

            console.log("✅ Выход выполнен, статус:", response.status);
            window.location.href = '/';
        } catch (error) {
            console.error('❌ Ошибка выхода:', error);
            window.location.href = '/';
        }
    }

    // Закрытие модального окна при клике вне его
    document.addEventListener('click', function(e) {
        if (e.target.id === 'changePasswordModal') {
            hideChangePasswordModal();
        }
    });

    // Обработчик нажатия Enter в полях пароля
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInputs = document.querySelectorAll('#changePasswordModal input[type="password"]');
        passwordInputs.forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    changePassword();
                }
            });
        });
    });

    // Автообновление данных каждые 10 секунд
    setInterval(() => {
        if (currentUser) {
            loadFriendRequests();
            loadContacts();
        }
    }, 10000);
</script>
</body>
</html>
